version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      langchain:
        patterns: ["langchain*"]
      outils-dev:
        patterns: ["pytest*", "ruff", "mypy"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
