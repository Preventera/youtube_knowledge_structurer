name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Garde-fou : si un test tentait un appel réseau vers Anthropic, il échouerait
  # au lieu de consommer une clé. Aucun secret n'est nécessaire à cette CI.
  ANTHROPIC_API_KEY: ""

jobs:
  tests:
    name: Tests · Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Tests (hors ligne)
        run: pytest --cov=yks --cov-report=term-missing --cov-report=xml

      - name: Vérifier que la CLI démarre
        run: yks --version && yks --print-schema document > /dev/null

      - name: Téléverser la couverture
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  qualite:
    name: Lint et typage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src/yks

  schema:
    name: Validation des exemples YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - name: Chaque exemple doit respecter le schéma courant
        run: |
          python - <<'PY'
          from pathlib import Path
          from yks.export.export_yaml import load_validated_yaml
          for path in sorted(Path("examples").glob("*.yaml")):
              document = load_validated_yaml(path)
              print(f"OK {path} · source={document.video.transcript_source}")
          PY

  secrets:
    name: Aucun secret versionné
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuser .env et clés d'API dans l'index Git
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::Le fichier .env ne doit jamais être versionné."
            exit 1
          fi
          if git grep -nIE 'sk-ant-[A-Za-z0-9_-]{10,}' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Une clé d'API Anthropic semble présente dans le dépôt."
            exit 1
          fi
          echo "Aucun secret détecté."
