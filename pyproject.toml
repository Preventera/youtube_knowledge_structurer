[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-knowledge-structurer"
version = "1.0.0"
description = "Transforme le contenu accessible d'une vidéo YouTube en YAML structuré, validé et traçable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0",
    "youtube-transcript-api>=1.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
]

[project.urls]
Homepage = "https://github.com/Preventera/youtube_knowledge_structurer"
Repository = "https://github.com/Preventera/youtube_knowledge_structurer"
Issues = "https://github.com/Preventera/youtube_knowledge_structurer/issues"
Changelog = "https://github.com/Preventera/youtube_knowledge_structurer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
yks = "yks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "B"]
